name: antaride_ui
description: Design system claymorphism Antaride — dipakai ketiga aplikasi.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.44.0"

# Ikut resolusi workspace root. Tanpa ini, package ini akan punya
# pubspec.lock sendiri dan bisa memakai versi paket yang berbeda dari aplikasi
# yang memakainya.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  #  Paket UI dari pub.dev
  # ---------------------------------------------------------------------------
  #
  #  Empat komponen di bawah TIDAK ditulis sendiri, dan itu keputusan sadar:
  #  sidebar beranimasi, skeleton loading, tarik-untuk-menyegarkan, dan spinner
  #  adalah hal yang sudah matang, sudah diuji di banyak perangkat, dan tidak
  #  ada bagiannya yang khas Antaride.
  #
  #  Yang TETAP ditulis sendiri: apa pun yang menyentuh uang, status order, dan
  #  tampilan claymorphism — di situ tidak ada paket yang cocok, dan di situ
  #  kesalahan kecil berakibat nyata.
  #
  #  Ketiganya dibungkus di paket ini, bukan dipakai langsung dari layar. Itu
  #  yang membuat penggantian paket nanti menyentuh satu file, bukan lima puluh
  #  layar — dan yang membuat ketiga aplikasi memakai teks dan warna yang sama.
  #
  flutter_zoom_drawer: ^3.2.0
  shimmer: ^4.0.0
  easy_refresh: ^3.5.1
  flutter_spinkit: ^5.2.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # ==========================================================================
  #  FONT DIPAKETKAN, TIDAK DIUNDUH SAAT RUNTIME
  # ==========================================================================
  #  Alternatifnya paket `google_fonts`, yang mengunduh font pada pemakaian
  #  pertama. Yang terjadi kalau begitu: layar pertama menampilkan font
  #  pengganti, lalu berkedip saat font sebenarnya selesai diunduh — dan pada
  #  jaringan lambat kedipannya berlangsung beberapa detik.
  #
  #  Aplikasi ini dipakai di Medan pada jaringan yang sering buruk, dan layar
  #  pertama adalah layar masuk. Berkedip di sana adalah kesan pertama.
  #
  #  Biayanya: sekit 240 KB per aplikasi. Itu harga yang jelas lebih murah.
  # ==========================================================================
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
