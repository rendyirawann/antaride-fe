# Aplikasi merchant.
#
# ==============================================================================
#  RUANG LINGKUPNYA SENGAJA PALING KECIL DI FASE 1
# ==============================================================================
#  Backend Fase 1 punya tabel merchant dan menu, tapi alur pesan-makanan
#  end-to-end belum ada di API mobile. Yang bisa dikerjakan aplikasi ini
#  sekarang: masuk, melihat status outlet, dan membuka-menutup outlet.
#
#  Kenapa tetap dibuat sekarang, bukan nanti: struktur tiga aplikasi ditetapkan
#  di awal. Menambahkan aplikasi ketiga ke workspace yang sudah berjalan berarti
#  memindahkan kode bersama yang sudah terjalin ke dua aplikasi — dan yang
#  terjadi biasanya bukan pemindahan, tapi penyalinan.
# ==============================================================================
name: antaride_merchant
description: Aplikasi merchant Antaride.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  antaride_core: ^0.1.0
  antaride_ui: ^0.1.0
  antaride_api: ^0.1.0
  antaride_auth: ^0.1.0

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2

  # ---------------------------------------------------------------------------
  #  Paket UI dari pub.dev
  # ---------------------------------------------------------------------------
  #
  #  Keempat hal di bawah TIDAK ditulis sendiri, dan itu keputusan sadar:
  #  sidebar beranimasi, skeleton loading, tarik-untuk-menyegarkan, dan spinner
  #  adalah komponen yang sudah matang, sudah diuji di banyak perangkat, dan
  #  tidak ada bagiannya yang khas Antaride.
  #
  #  Yang tetap ditulis sendiri: apa pun yang menyentuh uang, status order, dan
  #  tampilan claymorphism — karena di situ justru tidak ada paket yang cocok,
  #  dan di situ kesalahan kecil berakibat nyata.
  #
  flutter_zoom_drawer: ^3.2.0
  shimmer: ^4.0.0
  easy_refresh: ^3.5.1
  flutter_spinkit: ^5.2.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
