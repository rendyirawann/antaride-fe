# Aplikasi penumpang.
#
# ==============================================================================
#  KENAPA TIGA APLIKASI TERPISAH, BUKAN SATU DENGAN PERAN
# ==============================================================================
#  Penumpang, driver, dan merchant memakai aplikasi yang berbeda di HP mereka —
#  sama seperti Gojek dan GoPartner. Alasannya bukan teknis:
#
#    Ukuran     driver butuh peta, GPS latar belakang, dan foreground service.
#               Penumpang tidak. Menyatukannya berarti penumpang mengunduh
#               puluhan megabyte dan memberi izin lokasi latar belakang untuk
#               kode yang tidak pernah dia jalankan.
#
#    Izin       izin lokasi latar belakang wajib dijelaskan ke Play Store, dan
#               aplikasi penumpang yang memintanya akan ditolak review.
#
#    Siklus     driver butuh pembaruan lebih sering. Menyatukannya berarti
#               setiap perbaikan kecil di aplikasi driver memaksa seluruh
#               penumpang memperbarui aplikasinya.
#
#  Yang DIBAGI adalah paket di `packages/` — tema, lapisan API, dan model.
#  Yang TIDAK dibagi adalah layar, karena memang tidak ada layar yang sama.
# ==============================================================================
name: antaride_customer
description: Aplikasi penumpang Antaride.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  antaride_core: ^0.1.0
  antaride_ui: ^0.1.0
  antaride_api: ^0.1.0
  antaride_notifications: ^0.1.0
  antaride_auth: ^0.1.0
  antaride_realtime: ^0.1.0
  antaride_maps: ^0.1.0

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.20.2

  # ---------------------------------------------------------------------------
  #  Paket UI dari pub.dev
  # ---------------------------------------------------------------------------
  #
  #  Keempat hal di bawah TIDAK ditulis sendiri, dan itu keputusan sadar:
  #  sidebar beranimasi, skeleton loading, tarik-untuk-menyegarkan, dan spinner
  #  adalah komponen yang sudah matang, sudah diuji di banyak perangkat, dan
  #  tidak ada bagiannya yang khas Antaride.
  #
  #  Yang tetap ditulis sendiri: apa pun yang menyentuh uang, status order, dan
  #  tampilan claymorphism — karena di situ justru tidak ada paket yang cocok,
  #  dan di situ kesalahan kecil berakibat nyata.
  #
  flutter_zoom_drawer: ^3.2.0
  shimmer: ^4.0.0
  easy_refresh: ^3.5.1
  flutter_spinkit: ^5.2.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  # Dipakai HANYA oleh test: adapter Dio palsu yang mencatat header
  # `Idempotency-Key` yang benar-benar terkirim. Aplikasi sendiri tidak pernah
  # menyentuh Dio langsung — itu ada di `antaride_api`.
  dio: ^5.7.0

flutter:
  uses-material-design: true
