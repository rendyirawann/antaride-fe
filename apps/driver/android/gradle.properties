org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# =============================================================================
#  KOMPILASI INKREMENTAL KOTLIN DIMATIKAN
# =============================================================================
#  Gejalanya: build gagal dengan
#
#    Could not close incremental caches in
#    ...build/shared_preferences_android/kotlin/compileDebugKotlin/cacheable
#    /caches-jvm/jvm/kotlin: class-fq-name-to-source.tab, ...
#
#  Penyebabnya BUKAN cache yang rusak. `flutter clean`, menghapus direktori
#  build, dan menghentikan Gradle daemon — ketiganya sudah dicoba dan tidak
#  menolong.
#
#  Penyebabnya jalur yang terlalu panjang. Kotlin membuat cache inkremental
#  belasan tingkat di dalam `build/`, sementara direktori proyeknya sendiri
#  sudah dalam:
#
#    C:/xampp/htdocs/myProject/antaride/antaride-fe/apps/customer/
#
#  Jalur cache-nya menembus batas 260 karakter Windows pada berkas turunan
#  tertentu. Yang gagal adalah panggilan Windows untuk MENUTUP berkasnya, bukan
#  untuk membukanya — itu sebabnya pesannya berbunyi "could not CLOSE".
#
#  Tiga jalan keluar, dan yang ketiga yang dipilih:
#
#    1. Nyalakan LongPathsEnabled di registry Windows. Menyelesaikannya di akar,
#       tapi perubahan tingkat sistem tidak ikut berpindah ke komputer lain —
#       dan pengembang berikutnya menemui galat yang persis sama.
#    2. Pindahkan repo ke jalur pendek, misalnya C:/antaride. Menyelesaikannya
#       juga, tapi mengubah tata letak yang sudah dipakai XAMPP.
#    3. Matikan kompilasi inkremental Kotlin — cache dalam itu tidak dibuat.
#
#  Biayanya: Kotlin dikompilasi ulang penuh setiap build. Untuk proyek ini yang
#  kode Kotlin-nya hanya MainActivity dan kode plugin, tambahannya beberapa
#  detik. Seluruh logika aplikasi ada di Dart, yang punya cache inkrementalnya
#  sendiri dan tidak terpengaruh baris ini.
#
#  Kalau nanti dibangun di CI Linux, baris ini boleh dihapus: batas jalur itu
#  tidak ada di sana.
# =============================================================================
kotlin.incremental=false
