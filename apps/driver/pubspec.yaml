# Aplikasi driver.
#
# Lihat `apps/customer/pubspec.yaml` untuk alasan tiga aplikasi ini dipisah.
#
# Yang ADA di sini dan tidak ada di aplikasi penumpang: geolocator dengan izin
# lokasi latar belakang. Driver mengirim posisi selama bekerja walaupun layarnya
# mati — tanpa itu dia hilang dari indeks ketersediaan dan berhenti mendapat
# tawaran, dan dia tidak akan tahu sebabnya.
name: antaride_driver
description: Aplikasi driver Antaride.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  antaride_core: ^0.1.0
  antaride_ui: ^0.1.0
  antaride_api: ^0.1.0
  antaride_notifications: ^0.1.0
  antaride_media: ^0.1.0
  antaride_auth: ^0.1.0
  antaride_onboarding: ^0.1.0
  antaride_realtime: ^0.1.0
  antaride_maps: ^0.1.0

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.20.2

  # ---------------------------------------------------------------------------
  #  Paket UI dari pub.dev
  # ---------------------------------------------------------------------------
  #
  #  Keempat hal di bawah TIDAK ditulis sendiri, dan itu keputusan sadar:
  #  sidebar beranimasi, skeleton loading, tarik-untuk-menyegarkan, dan spinner
  #  adalah komponen yang sudah matang, sudah diuji di banyak perangkat, dan
  #  tidak ada bagiannya yang khas Antaride.
  #
  #  Yang tetap ditulis sendiri: apa pun yang menyentuh uang, status order, dan
  #  tampilan claymorphism — karena di situ justru tidak ada paket yang cocok,
  #  dan di situ kesalahan kecil berakibat nyata.
  #
  flutter_zoom_drawer: ^3.2.0
  shimmer: ^4.0.0
  easy_refresh: ^3.5.1
  flutter_spinkit: ^5.2.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_foreground_task: ^11.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  # Dipakai HANYA oleh test: adapter Dio palsu yang membalas dari fixture
  # backend dan mencatat header `Idempotency-Key` yang benar-benar terkirim.
  # Aplikasi sendiri tidak pernah menyentuh Dio — itu ada di `antaride_api`.
  dio: ^5.7.0

flutter:
  uses-material-design: true
